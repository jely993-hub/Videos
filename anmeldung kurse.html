<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung Adventskurse · Serikon Flower Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root { --tinte:#3E2F28; --grund:#F7F7F7; --linie:#d9d2cc; --leise:#7a6a61; color-scheme:light; }
*, *::before, *::after { box-sizing:border-box; }
html, body { margin:0; background:var(--grund); }
body { font-family:"Cormorant Garamond", Garamond, "Times New Roman", serif; color:var(--tinte); padding:24px 16px 48px; }
form { max-width:620px; margin:0 auto; }
.marke { text-align:center; font-size:14px; letter-spacing:.3em; font-weight:500; margin:0 0 18px; }
.marke a { color:inherit; text-decoration:none; }
h1 { font-weight:500; font-size:30px; letter-spacing:.06em; text-align:center; margin:0 0 6px; }
.einleitung { text-align:center; font-style:italic; font-size:19px; line-height:1.45; margin:0 0 28px; }
fieldset { border:0; padding:0; margin:0 0 26px; }
legend { font-size:14px; letter-spacing:.22em; text-transform:uppercase; font-weight:600; margin:0 0 10px; padding:0; }
.wahl { display:grid; gap:8px; }
.wahl label { display:flex; align-items:flex-start; gap:12px; border:1px solid var(--linie); background:#fff;
  padding:12px 14px; cursor:pointer; font-size:19px; line-height:1.3; border-radius:2px; }
.wahl small { display:block; font-size:16px; color:var(--leise); margin-top:2px; }
.wahl input { accent-color:var(--tinte); width:18px; height:18px; margin:3px 0 0; flex:none; }
.wahl label:has(input:checked) { border-color:var(--tinte); box-shadow:inset 0 0 0 1px var(--tinte); }
.farben { display:flex; flex-wrap:wrap; gap:8px; }
.farben label { position:relative; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--linie);
  background:#fff; padding:8px 14px; border-radius:999px; cursor:pointer; font-size:18px; }
.farben input { position:absolute; opacity:0; width:1px; height:1px; }
.farben label:has(input:checked) { background:var(--tinte); color:#fff; border-color:var(--tinte); }
.farben label:has(input:focus-visible) { outline:2px solid var(--tinte); outline-offset:2px; }
.punkt { width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.15); flex:none; }
.feld { display:block; margin:0 0 14px; font-size:17px; }
.feld span { display:block; margin-bottom:5px; }
input[type=text], input[type=tel], input[type=email], select, textarea {
  width:100%; font:inherit; font-size:18px; color:var(--tinte); background:#fff; border:1px solid var(--linie);
  border-radius:2px; padding:10px 12px; }
textarea { min-height:70px; resize:vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--tinte); outline-offset:2px; }
.preis { text-align:center; font-size:21px; margin:4px 0 18px; min-height:28px; }
.knopf { display:block; width:100%; font:inherit; font-size:20px; letter-spacing:.08em; border-radius:2px;
  padding:14px 18px; cursor:pointer; margin:0 0 10px; }
.knopf-haupt { color:#fff; background:var(--tinte); border:1px solid var(--tinte); }
.knopf-neben { color:var(--tinte); background:#fff; border:1px solid var(--tinte); font-size:18px; }
.fehler { color:#8a2b1e; text-align:center; font-size:17px; min-height:22px; margin:4px 0 0; }
.fuss { text-align:center; font-size:16px; color:var(--leise); margin:16px 0 0; line-height:1.45; }
.versteckt { position:absolute; left:-9999px; }
</style>
</head>
<body>
<form id="anmeldung" action="https://formsubmit.co/info@serikonflowerart.ch" method="POST">
  <p class="marke"><a href="https://www.serikonflowerart.ch">SERIKON FLOWER ART</a></p>
  <h1>ANMELDUNG</h1>
  <p class="einleitung">Wähle aus, was zu dir passt. Ich melde mich persönlich und bestätige deinen Platz.</p>

  <input type="hidden" name="_subject" value="Neue Kursanmeldung">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="https://www.serikonflowerart.ch">
  <input type="text" name="_honey" class="versteckt" tabindex="-1" autocomplete="off" aria-hidden="true">

  <fieldset>
    <legend>Welcher Kurs</legend>
    <div class="wahl">
      <label><input type="radio" name="Kurs" value="Adventskranz binden, Samstag 21. November 2026, 9 bis 12 Uhr" data-k="binden" required>
        <span>Adventskranz binden<small>Samstag, 21. November 2026 · 9 bis 12 Uhr</small></span></label>
      <label><input type="radio" name="Kurs" value="Adventskranz stecken, Freitag 27. November 2026, 19 bis 21 Uhr" data-k="stecken">
        <span>Adventskranz stecken<small>Freitag, 27. November 2026 · 19 bis 21 Uhr</small></span></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Dekoration</legend>
    <div class="wahl">
      <label><input type="radio" name="Dekoration" value="aus dem Atelier" data-d="atelier" required>
        <span>Dekoration aus dem Atelier</span></label>
      <label><input type="radio" name="Dekoration" value="eigene Schmuckstücke" data-d="eigene">
        <span>Ich bringe eigene Schmuckstücke mit<small>Sie dürfen wiederkehren</small></span></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>In welcher Farbe soll dein Advent leuchten</legend>
    <div class="farben">
      <label><input type="radio" name="Farbe" value="Warmes Kupfer"><span class="punkt" style="background:#b87149"></span>Warmes Kupfer</label>
      <label><input type="radio" name="Farbe" value="Zartes Rosé"><span class="punkt" style="background:#e3bfb6"></span>Zartes Rosé</label>
      <label><input type="radio" name="Farbe" value="Stilles Weiss"><span class="punkt" style="background:#fbfaf6"></span>Stilles Weiss</label>
      <label><input type="radio" name="Farbe" value="Tiefes Rot"><span class="punkt" style="background:#7a1f22"></span>Tiefes Rot</label>
      <label><input type="radio" name="Farbe" value="Grün und Kerzenlicht"><span class="punkt" style="background:#3f5a3a"></span>Grün und Kerzenlicht</label>
      <label><input type="radio" name="Farbe" value="Überrasch mich"><span class="punkt" style="background:conic-gradient(#b87149,#e3bfb6,#7a1f22,#3f5a3a,#b87149)"></span>Überrasch mich</label>
    </div>
    <label class="feld" style="margin-top:12px"><span>Oder in deinen Worten (freiwillig)</span>
      <input type="text" name="Farbwunsch" placeholder="z. B. Gold und Dunkelgrün wie im Wald"></label>
  </fieldset>

  <fieldset>
    <legend>Zu dir</legend>
    <label class="feld"><span>Vorname und Name</span><input type="text" name="Name" autocomplete="name" required></label>
    <label class="feld"><span>E-Mail</span><input type="email" name="email" autocomplete="email" required></label>
    <label class="feld"><span>Telefon (freiwillig)</span><input type="tel" name="Telefon" autocomplete="tel"></label>
    <label class="feld"><span>Wie viele Personen</span>
      <select name="Personen">
        <option value="1">1 Person</option><option value="2">2 Personen</option>
        <option value="3">3 Personen</option><option value="4">4 Personen</option>
      </select></label>
    <label class="feld"><span>Möchtest du mir noch etwas sagen? (freiwillig)</span><textarea name="Notiz"></textarea></label>
  </fieldset>

  <p class="preis" id="preis" aria-live="polite"></p>
  <input type="hidden" name="Preis" id="preisfeld">
  <button type="submit" class="knopf knopf-haupt">ANMELDUNG SENDEN</button>
  <button type="button" class="knopf knopf-neben" id="whatsapp">Lieber per WhatsApp</button>
  <p class="fehler" id="fehler" aria-live="polite"></p>
  <p class="fuss">Höchstens acht Personen pro Kurs.<br>Ich melde mich persönlich und bestätige deinen Platz.</p>
</form>

<script>
(function () {
  var PREISE = { binden: { atelier: 280, eigene: 250 }, stecken: { atelier: 180, eigene: 150 } };
  var f = document.getElementById('anmeldung');
  var preisEl = document.getElementById('preis'), preisFeld = document.getElementById('preisfeld');
  var fehlerEl = document.getElementById('fehler');
  function gewaehlt(n) { return f.querySelector('[name="' + n + '"]:checked'); }
  function wert(n) { var e = gewaehlt(n) || f.elements[n]; return e && e.value ? e.value.trim() : ''; }
  function preis() {
    var k = gewaehlt('Kurs'), d = gewaehlt('Dekoration');
    if (!k || !d) { preisEl.textContent = ''; preisFeld.value = ''; return ''; }
    var einzel = PREISE[k.dataset.k][d.dataset.d], p = +wert('Personen') || 1;
    var t = p > 1 ? p + ' × CHF ' + einzel + '.– = CHF ' + (p * einzel) + '.–' : 'CHF ' + einzel + '.–';
    preisEl.textContent = t; preisFeld.value = t; return t;
  }
  f.addEventListener('change', function () { fehlerEl.textContent = ''; preis(); });
  f.addEventListener('invalid', function () { fehlerEl.textContent = 'Bitte wähle Kurs und Dekoration und gib Name und E-Mail an.'; }, true);
  document.getElementById('whatsapp').addEventListener('click', function () {
    if (!gewaehlt('Kurs') || !gewaehlt('Dekoration') || !wert('Name')) {
      fehlerEl.textContent = 'Bitte wähle Kurs und Dekoration und gib deinen Namen an.'; return;
    }
    var zeilen = ['Hallo Jelena, ich möchte mich für einen Kurs anmelden.', '',
      'Kurs: ' + wert('Kurs'), 'Dekoration: ' + wert('Dekoration') + ' (' + preis() + ')',
      'Farbe: ' + ([wert('Farbe'), wert('Farbwunsch')].filter(Boolean).join(', ') || 'noch offen'),
      'Personen: ' + wert('Personen'), '', 'Name: ' + wert('Name')];
    if (wert('Telefon')) zeilen.push('Telefon: ' + wert('Telefon'));
    if (wert('Notiz')) zeilen.push('', wert('Notiz'));
    window.location.href = 'https://wa.me/41799165148?text=' + encodeURIComponent(zeilen.join('\n'));
  });
})();
</script>
</body>
</html>
